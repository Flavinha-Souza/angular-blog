<div class="container__small-card">
  <a [routerLink]="['content', id]" class="container__small-card-content">
    <div class="small-card__photo">
      <img [src]="photoCover" alt="Capa do post" />
    </div>

    <div class="small-card__title">
      <div class="small-card__tags" *ngIf="tags.length > 0">
        <small *ngFor="let tag of tags">#{{ tag }} </small>
      </div>
      <h1>
        {{ cardTitle }}
      </h1>
    </div>
  </a>
</div>
